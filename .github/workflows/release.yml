name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Write access only for this job, not the whole workflow.
    permissions:
      contents: write # version commits and tags
      pull-requests: write # "Version Packages" PR
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # Opens a "Version Packages" PR from pending changesets; once that PR is merged, publishes.
      # Publishing uses npm trusted publishing (OIDC): configure it for this repo on npmjs.com,
      # no NPM_TOKEN secret needed.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true
